name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: CI
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          package-manager-cache: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: false
          node-version-file: false
      - run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, build and test
        run: pnpm run ci --coverage
      - name: Record the measured commits
        if: ${{ !cancelled() }}
        run: mkdir -p coverage && git rev-parse HEAD HEAD^1 > coverage/measured-commits.txt
      - name: Record the job that produced the test reports
        if: ${{ !cancelled() }}
        run: echo "${{ job.check_run_id }}" > coverage/job.txt
      - name: Upload coverage and test reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-tests
          path: |
            coverage/lcov.info
            coverage/junit.xml
            coverage/measured-commits.txt
            coverage/job.txt
          if-no-files-found: error
          retention-days: 14
