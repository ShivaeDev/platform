packages: []

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

# Framework releases must be usable together as soon as they publish.
minimumReleaseAgeExclude: [ "@shivaedev/*" ]

# Applications depend on @shivaedev/platform alone; hoisting links the pieces it brings so they resolve by their own names.
publicHoistPattern: [ "@shivaedev/*" ]

overrides:
  # Recharts pins an unattested reselect release; use its attested compatible successor.
  "recharts>reselect": "catalog:"
  "@effect/platform-node-shared": "catalog:"

allowBuilds:
  esbuild: true
  msgpackr-extract: true

catalog:
  shadcn: 4.22.1
  lucide-react: 1.61.0
  "cn": 0.5.0
  "@base-ui/react": 1.9.0
  "recharts": 3.10.1
  "@tanstack/react-table": 9.3.1
  reselect: 5.3.0
  railway: 3.16.0
  "@effect/atom-react": 4.0.6
  "@effect/platform-node": 4.0.6
  "@effect/platform-node-shared": 4.0.6
  "@effect/sql-pg": 4.0.6
  "@effect/vitest": 4.0.6
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.45
  "@types/node": 24.19.2
  "@types/pg": 8.20.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  class-variance-authority: 0.7.1
  better-auth: 1.7.12
  effect: 4.0.6
  happy-dom: 21.0.4
  pg: 8.23.0
  pg-boss: 12.38.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.5
