name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI_WORKSPACE_CONCURRENCY: ${{ vars.PLATFORM_CI_CONCURRENCY || 4 }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - name: Test CI orchestration
        run: |
          mkdir -p .ci
          node --conditions=source --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=.ci/orchestration.junit.xml \
            script/ci/*.test.ts script/ci/*.spec.ts script/package-check/archives.test.ts
      - name: Wrap Node JUnit cases in a standard test suite
        if: always()
        run: node script/ci/nodeJunit.ts .ci/orchestration.junit.xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: orchestration-results
          path: .ci/orchestration.junit.xml
          include-hidden-files: true
          overwrite: true
          retention-days: 14

  build:
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-workspace-cache: 'true'
      - run: pnpm build
        env:
          CI_WORKSPACE_SORT: 'false'
      - name: Prepare and validate all package archives
        run: pnpm test:package --prepare .ci/packages
      - name: Load measured consumer timings from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --conditions=source script/ci/mainConsumerTimings.ts .ci/packages/consumer-durations.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-${{ github.sha }}-${{ github.run_attempt }}
          path: .ci/packages
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2
          compression-level: 0

  typecheck:
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  tests:
    name: tests (${{ matrix.shard }})
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm db:setup
      - name: Test workspace shard
        run: >-
          pnpm test --workspace --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default --reporter=json --reporter=junit
          --outputFile.json=${{ github.workspace }}/.ci/tests.json
          --outputFile.junit=${{ github.workspace }}/.ci/tests.junit.xml
      - name: Record test timings
        if: always()
        run: node --conditions=source script/ci/summary.ts .ci/tests.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          overwrite: true
          name: test-timings-${{ matrix.shard }}
          path: |
            .ci/tests.json
            .ci/tests.junit.xml
          include-hidden-files: true
          retention-days: 14

  consumers:
    name: packed consumers (${{ matrix.shard }})
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'push' && '[1]' || '[1,2,3,4,5,6,7,8]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          consumer-cache: 'true'
      - uses: ./.github/actions/await-packages
        with:
          token: ${{ github.token }}
      - name: Check packed consumer shard
        run: >-
          pnpm test:package --archives .ci/packages
          --shard=${{ matrix.shard }}/${{ strategy.job-total }} --report .ci/consumers.json
          --timings .ci/packages/consumer-durations.json
      - name: Record consumer timings
        if: always()
        run: node --conditions=source script/ci/summary.ts .ci/consumers.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          overwrite: true
          name: consumer-timings-${{ matrix.shard }}
          path: .ci/consumers.json
          include-hidden-files: true
          retention-days: 14
      - name: Save complete consumer store on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.setup.outputs.store-path }}
          key: ${{ steps.setup.outputs.consumer-cache-key }}

  verify:
    if: always()
    needs: [lint, build, typecheck, tests, consumers]
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 1
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          for (const [name, job] of Object.entries(jobs)) {
            console.log(`${name}: ${job.result}`);
          }
          if (Object.values(jobs).some(job => job.result !== 'success')) process.exit(1);
          JS
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          pattern: consumer-timings-*
          path: .ci/main-timings
      - name: Merge successful main consumer timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          node script/ci/mergeConsumerTimings.ts --directory .ci/main-timings
          --output .ci/consumer-durations.json --run-id=${{ github.run_id }} --sha=${{ github.sha }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          overwrite: true
          name: consumer-balancing
          path: .ci/consumer-durations.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  test-results:
    name: Codecov test analytics
    if: ${{ !cancelled() }}
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: test-timings-*
          path: .ci/test-results
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: orchestration-results
          path: .ci/test-results/orchestration
      - name: Upload JUnit reports
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          directory: .ci/test-results
          handle_no_reports_found: true
          flags: tests
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false

  coverage:
    name: Codecov coverage (${{ matrix.shard }})
    if: ${{ !cancelled() }}
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm db:setup
      # Include never-imported source in one fresh shard; Codecov merges hits from all eight.
      - name: Collect V8 coverage
        run: >-
          pnpm test --workspace --shard=${{ matrix.shard }}/${{ strategy.job-total }} --coverage
          --coverage.cleanOnRerun=${{ matrix.shard != 1 }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: coverage-${{ matrix.shard }}
          path: .ci/coverage
          include-hidden-files: true
          overwrite: true
          retention-days: 14
      - name: Upload coverage shard
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: .ci/coverage/lcov.info
          disable_search: true
          flags: workspace
          name: workspace-${{ matrix.shard }}
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false

  bundles:
    name: Codecov bundle analysis
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    needs: [verify, build]
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/await-packages
        with:
          token: ${{ github.token }}
      - name: Restore compiled packages from the shared build
        run: |
          for archive in .ci/packages/*.tgz; do
            package=$(basename "$archive" .tgz)
            tar -xzf "$archive" --strip-components=1 -C "packages/$package" package/dist
          done
      - name: Analyze all published JavaScript entries
        run: pnpm report:bundles
        env:
          CODECOV_UPLOAD: 'true'
          CODECOV_USE_OIDC: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: bundle-analysis
          path: .ci/bundles
          include-hidden-files: true
          overwrite: true
          retention-days: 14
