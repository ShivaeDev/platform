name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLATFORM_EFFECT_PRISMA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_effect_prisma
    services:
      postgres:
        image: postgres:18-alpine@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
        env:
          POSTGRES_DB: platform_effect_prisma
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize PostgreSQL
        run: >-
          docker exec -i "${{ job.services.postgres.id }}"
          psql --set ON_ERROR_STOP=1
          --username postgres
          --dbname platform_effect_prisma
          < packages/effect-prisma/test/schema.sql

      - name: Initialize Platform auth schema
        run: >-
          docker exec -i "${{ job.services.postgres.id }}"
          psql --set ON_ERROR_STOP=1
          --username postgres
          --dbname platform_effect_prisma
          < packages/platform/test/auth/schema.sql

      - name: Check formatting and lint
        run: pnpm check

      - name: Build packages
        run: pnpm build

      - name: Type-check with TypeScript 7
        run: pnpm typecheck

      - name: Type-check with TypeScript 6
        run: pnpm typecheck:compat

      - name: Test
        run: pnpm test

      - name: Test packed packages
        run: pnpm test:package
