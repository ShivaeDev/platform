name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - name: Test CI orchestration
        run: pnpm test:orchestration

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Prepare and validate all package archives
        run: pnpm test:package --prepare .ci/packages
      - name: Bundle build outputs
        run: tar -czf .ci/build.tgz packages/*/dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-${{ github.sha }}
          path: |
            .ci/build.tgz
            .ci/packages
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2
          compression-level: 0

  typecheck:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages-${{ github.sha }}
          path: .ci
      - run: tar -xzf .ci/build.tgz
      - run: pnpm typecheck

  tests:
    name: tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm db:setup
      - name: Test workspace shard
        run: >-
          pnpm test --workspace --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default --reporter=json --outputFile=${{ github.workspace }}/.ci/tests.json
      - name: Record test timings
        if: always()
        run: node --conditions=source script/ci/summary.ts .ci/tests.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: test-timings-${{ matrix.shard }}
          path: .ci/tests.json
          include-hidden-files: true
          retention-days: 14

  consumers:
    name: packed consumers (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages-${{ github.sha }}
          path: .ci
      - name: Check packed consumer shard
        run: >-
          pnpm test:package --archives .ci/packages
          --shard=${{ matrix.shard }}/${{ strategy.job-total }} --report .ci/consumers.json
      - name: Record consumer timings
        if: always()
        run: node --conditions=source script/ci/summary.ts .ci/consumers.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: consumer-timings-${{ matrix.shard }}
          path: .ci/consumers.json
          include-hidden-files: true
          retention-days: 14

  verify:
    if: always()
    needs: [lint, build, typecheck, tests, consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          for (const [name, job] of Object.entries(jobs)) {
            console.log(`${name}: ${job.result}`);
          }
          if (Object.values(jobs).some(job => job.result !== 'success')) process.exit(1);
          JS
