name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CHANGELOG_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  CI_WORKSPACE_CONCURRENCY: ${{ vars.PLATFORM_CI_CONCURRENCY || 4 }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin the checked PR changelog base
        if: github.event_name == 'pull_request'
        run: echo "CHANGELOG_BASE_REF=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - name: Test CI orchestration
        run: pnpm test:orchestration

  build:
    # Failed-job reruns must reuse this upload even when build ran in an earlier attempt.
    outputs:
      packages-artifact-id: ${{ steps.packages.outputs.artifact-id }}
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Prepare and validate all package archives
        run: pnpm test:package --prepare .ci/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: packages
        with:
          name: packages-${{ github.sha }}-${{ github.run_attempt }}
          path: .ci/packages
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30 # GitHub allows re-runs for 30 days, and a re-run of failed jobs reuses these archives
          compression-level: 0

  typecheck:
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  shard-plan:
    name: Select measured shard counts
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 2
    outputs:
      tests-run-id: ${{ steps.timings.outputs.tests-run-id }}
      tests-artifact-id: ${{ steps.timings.outputs.tests-artifact-id }}
      tests-shards: ${{ steps.timings.outputs.tests-shards }}
      tests-count: ${{ steps.timings.outputs.tests-count }}
      consumers-run-id: ${{ steps.timings.outputs.consumers-run-id }}
      consumers-artifact-id: ${{ steps.timings.outputs.consumers-artifact-id }}
      consumers-shards: ${{ steps.timings.outputs.consumers-shards }}
      consumers-count: ${{ steps.timings.outputs.consumers-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - name: Pin main snapshots and independent shard counts
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { mainShardPlan } from './script/ci/mainShardPlan.ts';
          const deadline = performance.now() + 15000;
          const plan = mainShardPlan(process.env.GITHUB_REPOSITORY, args => {
            const remaining = deadline - performance.now();
            if (remaining <= 0) throw new Error('Main snapshot lookup timed out');
            return execFileSync('gh', args, { encoding: 'utf8', timeout: Math.min(10000, Math.ceil(remaining)), stdio: ['ignore', 'pipe', 'pipe'] });
          });
          for (const [kind, value] of Object.entries(plan)) {
            console.log(`${kind}: ${value.count} shards; main timing run ${value.runId || 'none'}`);
            const shards = Array.from({ length: value.count }, (_, index) => index + 1);
            appendFileSync(process.env.GITHUB_OUTPUT, `${kind}-run-id=${value.runId}\n${kind}-artifact-id=${value.artifactId}\n${kind}-count=${value.count}\n${kind}-shards=${JSON.stringify(shards)}\n`);
          }
          JS

  tests:
    needs: shard-plan
    permissions:
      contents: read
      actions: read
    name: tests (${{ matrix.shard }})
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shard-plan.outputs.tests-shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tally reports a PR's coverage for its head commit, so its lines must match that commit, not the merge with main.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          postgres: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.shard-plan.outputs.tests-run-id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.shard-plan.outputs.tests-run-id }}
          artifact-ids: ${{ needs.shard-plan.outputs.tests-artifact-id }}
          path: .ci/test-balancing
      - run: pnpm db:setup
      - name: Test workspace shard
        run: >-
          pnpm test --workspace --ci-shard --shard=${{ matrix.shard }}/${{ strategy.job-total }} --coverage
      - name: Record test timings
        if: always()
        run: node --conditions=source script/ci/summary.ts .ci/tests.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          overwrite: true
          name: test-timings-${{ matrix.shard }}
          path: |
            .ci/tests.json
            .ci/tests.*.json
            .ci/tests*.junit.xml
            .ci/vite/vitest/**/results.json
          include-hidden-files: true
          retention-days: 14
      - name: Upload coverage for Tally
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          overwrite: true
          name: coverage-tests-${{ matrix.shard }}
          path: |
            .ci/coverage/lcov.info
            .ci/tests.junit.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  consumers:
    needs: [build, shard-plan]
    name: packed consumers (${{ matrix.shard }})
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shard-plan.outputs.consumers-shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download package archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.build.outputs.packages-artifact-id }}
          path: .ci/packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.shard-plan.outputs.consumers-run-id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.shard-plan.outputs.consumers-run-id }}
          artifact-ids: ${{ needs.shard-plan.outputs.consumers-artifact-id }}
          path: .ci/consumer-balancing
      - name: Prepare consumer timing fallback
        if: needs.shard-plan.outputs.consumers-run-id == ''
        run: |
          mkdir -p .ci/consumer-balancing
          echo '{"runId":"","sha":"","timings":[]}' > .ci/consumer-balancing/consumer-durations.json
      - name: Check packed consumer shard
        run: >-
          pnpm test:package --archives .ci/packages
          --shard=${{ matrix.shard }}/${{ strategy.job-total }} --report .ci/consumers.json
          --timings .ci/consumer-balancing/consumer-durations.json
      - name: Record consumer timings
        if: always()
        run: node --conditions=source script/ci/summary.ts .ci/consumers.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          overwrite: true
          name: consumer-timings-${{ matrix.shard }}
          path: .ci/consumers.json
          include-hidden-files: true
          retention-days: 14

  published-starter:
    name: Packed starter
    needs: build
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          postgres: 'true'
      - name: Download package archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.build.outputs.packages-artifact-id }}
          path: .ci/packages
      - run: pnpm db:setup
      - name: Generate an app from the packed command and test packed workspace dependencies
        run: pnpm --filter @shivaedev/starter check:published --archives .ci/packages

  verify:
    if: always()
    needs: [shard-plan, lint, build, typecheck, tests, consumers, published-starter]
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 1
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          for (const [name, job] of Object.entries(jobs)) {
            console.log(`${name}: ${job.result}`);
          }
          if (Object.values(jobs).some(job => job.result !== 'success')) process.exit(1);
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          pattern: '*-timings-*'
          path: .ci/main-timings
      - name: Read main job wall times
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > .ci/main-jobs.json
      - name: Merge successful main consumer timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          node --conditions=source script/ci/mergeConsumerTimings.ts --directory .ci/main-timings --jobs .ci/main-jobs.json
          --target-seconds ${{ vars.PLATFORM_CI_SHARD_SECONDS || 240 }}
          --output .ci/consumer-durations.json --count ${{ needs.shard-plan.outputs.consumers-count }} --run-id=${{ github.run_id }} --sha=${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          overwrite: true
          name: consumer-balancing
          path: .ci/consumer-durations.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Merge successful main test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          node --conditions=source script/ci/mergeTestTimings.ts --directory .ci/main-timings --jobs .ci/main-jobs.json
          --target-seconds ${{ vars.PLATFORM_CI_SHARD_SECONDS || 240 }}
          --output .ci/test-durations.json --count ${{ needs.shard-plan.outputs.tests-count }} --run-id=${{ github.run_id }} --sha=${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          overwrite: true
          name: test-balancing
          path: .ci/test-durations.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
