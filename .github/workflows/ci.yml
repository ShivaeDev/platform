name: CI

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CI_WORKSPACE_CONCURRENCY: ${{ vars.PLATFORM_CI_CONCURRENCY || 4 }}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - name: Test CI orchestration
        run: pnpm test:orchestration

  build:
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-workspace-cache: 'true'
      - run: pnpm build
        env:
          CI_WORKSPACE_SORT: 'false'
      - name: Prepare and validate all package archives
        run: pnpm test:package --prepare .ci/packages
      - name: Load measured consumer timings from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --conditions=source script/ci/mainConsumerTimings.ts .ci/packages/consumer-durations.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-${{ github.sha }}-${{ github.run_attempt }}
          path: .ci/packages
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30 # GitHub allows re-runs for 30 days, and a re-run of failed jobs reuses these archives
          compression-level: 0

  typecheck:
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test-plan:
    name: Select test timing baseline
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      actions: read
    timeout-minutes: 1
    outputs:
      run-id: ${{ steps.timings.outputs.run-id }}
      shards: ${{ steps.timings.outputs.shards }}
      shard-count: ${{ steps.timings.outputs.shard-count }}
    steps:
      - name: Select one successful main snapshot for every shard
        id: timings
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_COUNT: ${{ vars.PLATFORM_CI_TEST_SHARDS || 8 }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const count = Number(process.env.SHARD_COUNT);
          if (!Number.isSafeInteger(count) || count < 1) throw new Error('PLATFORM_CI_TEST_SHARDS must be a positive integer');
          appendFileSync(process.env.GITHUB_OUTPUT, `shard-count=${count}\nshards=${JSON.stringify(Array.from({ length: count }, (_, index) => index + 1))}\n`);
          JS
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
          if [[ -n "$run_id" ]]; then
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?name=test-balancing" \
              --jq '.artifacts[] | select(.expired == false) | .id' 2>/dev/null || true)
            if [[ -z "$artifact_id" ]]; then run_id=''; fi
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Main test timing run: ${run_id:-none; using equal weights}"

  tests:
    needs: test-plan
    permissions:
      contents: read
      actions: read
    name: tests (${{ matrix.shard }})
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.test-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.test-plan.outputs.run-id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.test-plan.outputs.run-id }}
          name: test-balancing
          path: .ci/test-balancing
      - run: pnpm db:setup
      - name: Test workspace shard
        run: >-
          pnpm test --workspace --shard=${{ matrix.shard }}/${{ strategy.job-total }} --coverage
          --reporter=default --reporter=json --reporter=junit
          --outputFile.json=${{ github.workspace }}/.ci/tests.json
          --outputFile.junit=${{ github.workspace }}/.ci/tests.junit.xml
      - name: Record test timings
        if: always()
        run: node --conditions=source script/ci/summary.ts .ci/tests.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          overwrite: true
          name: test-timings-${{ matrix.shard }}
          path: |
            .ci/tests.json
            .ci/vite/vitest/**/results.json
          include-hidden-files: true
          retention-days: 14
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: .ci/coverage/lcov.info
          disable_search: true
          flags: workspace
          name: tests-${{ matrix.shard }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: .ci/tests.junit.xml
          disable_search: true
          name: tests-${{ matrix.shard }}
          fail_ci_if_error: false

  codecov-notify:
    name: Codecov notifications
    if: ${{ !cancelled() }}
    needs: verify
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Send Codecov notifications after CI verification completes
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          run_command: send-notifications
          fail_ci_if_error: false

  consumers:
    name: packed consumers (${{ matrix.shard }})
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'push' && '[1]' || '[1,2,3,4,5,6,7,8]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
        with:
          consumer-cache: 'true'
      - uses: ./.github/actions/await-packages
        with:
          token: ${{ github.token }}
      - name: Check packed consumer shard
        run: >-
          pnpm test:package --archives .ci/packages
          --shard=${{ matrix.shard }}/${{ strategy.job-total }} --report .ci/consumers.json
          --timings .ci/packages/consumer-durations.json
      - name: Record consumer timings
        if: always()
        run: node --conditions=source script/ci/summary.ts .ci/consumers.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          overwrite: true
          name: consumer-timings-${{ matrix.shard }}
          path: .ci/consumers.json
          include-hidden-files: true
          retention-days: 14
      - name: Save complete consumer store on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.setup.outputs.store-path }}
          key: ${{ steps.setup.outputs.consumer-cache-key }}

  verify:
    if: always()
    needs: [test-plan, lint, build, typecheck, tests, consumers]
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 1
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          for (const [name, job] of Object.entries(jobs)) {
            console.log(`${name}: ${job.result}`);
          }
          if (Object.values(jobs).some(job => job.result !== 'success')) process.exit(1);
          JS
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          pattern: '*-timings-*'
          path: .ci/main-timings
      - name: Merge successful main consumer timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          node script/ci/mergeConsumerTimings.ts --directory .ci/main-timings
          --output .ci/consumer-durations.json --run-id=${{ github.run_id }} --sha=${{ github.sha }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          overwrite: true
          name: consumer-balancing
          path: .ci/consumer-durations.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Merge successful main test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          node --conditions=source script/ci/mergeTestTimings.ts --directory .ci/main-timings
          --output .ci/test-durations.json --count ${{ needs.test-plan.outputs.shard-count }} --run-id=${{ github.run_id }} --sha=${{ github.sha }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          overwrite: true
          name: test-balancing
          path: .ci/test-durations.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  bundles:
    name: Codecov bundle analysis
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    needs: [verify, build]
    permissions:
      contents: read
      actions: read
    runs-on: ${{ vars.PLATFORM_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/await-packages
        with:
          token: ${{ github.token }}
      - name: Measure every packed package
        continue-on-error: true
        run: pnpm report:bundles
        env:
          CODECOV_UPLOAD: 'true'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: bundle-analysis
          path: .ci/bundles/*.json
          include-hidden-files: true
          overwrite: true
          retention-days: 14
