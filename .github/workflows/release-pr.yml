name: Keep release PR current

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Authenticate branch pushes with GITHUB_TOKEN
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Regenerate the release PR unless it is queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node --conditions=source script/release/maintainPullRequest.ts
