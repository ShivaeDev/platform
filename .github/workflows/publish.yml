name: Publish packages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  verify-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      head: ${{ steps.decide.outputs.head }}
      base: ${{ steps.decide.outputs.base }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Decide whether this push raised package versions
        id: decide
        run: node --conditions=@shivaedev/source script/release/preparePublish.ts
        env:
          CHANGELOG_BASE_REF: ${{ github.event.before }}
      - name: Validate the release on main
        if: steps.decide.outputs.publish == 'true'
        run: pnpm changelog:check
        env:
          CHANGELOG_BASE_REF: ${{ github.event.before }}
      - name: Build packages
        if: steps.decide.outputs.publish == 'true'
        run: pnpm build
      - name: Check packed consumers and bins
        if: steps.decide.outputs.publish == 'true'
        run: pnpm test:package

  publish:
    needs: verify-packages
    if: needs.verify-packages.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.verify-packages.outputs.head }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
          node-version-file: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile=false

      - name: Validate collected release notes
        run: pnpm changelog:check
        env:
          CHANGELOG_BASE_REF: ${{ needs.verify-packages.outputs.base }}
      - name: Build packages
        run: pnpm build

      - name: Publish new package versions
        env:
          CHANGELOG_BASE_REF: ${{ needs.verify-packages.outputs.base }}
        run: node --conditions=@shivaedev/source script/release/publishPackages.ts

      - name: Write GitHub release notes
        env:
          RELEASE_HEAD_SHA: ${{ needs.verify-packages.outputs.head }}
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_BASE_REF: ${{ needs.verify-packages.outputs.base }}
        run: node --conditions=@shivaedev/source script/release/publishNotes.ts
