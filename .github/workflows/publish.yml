name: Publish packages

on:
  push:
    branches:
      - main
    paths:
      - packages/*/package.json

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  verify-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile=false
      - name: Validate collected release notes
        run: pnpm run changelog:release --check
        env:
          CHANGELOG_BASE_REF: ${{ github.event.before }}
      - name: Build packages
        run: pnpm build
      - name: Check packed consumers and bins
        run: pnpm test:package

  publish:
    needs: verify-packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.10.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile=false

      - name: Validate collected release notes
        run: pnpm run changelog:release --check
        env:
          CHANGELOG_BASE_REF: ${{ github.event.before }}
      - name: Build packages
        run: pnpm build

      - name: Publish new package versions
        run: pnpm --recursive publish --no-git-checks
