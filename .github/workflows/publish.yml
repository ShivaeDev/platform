name: Publish packages

on:
  push:
    branches:
      - main
    paths:
      - packages/*/package.json

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  verify-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      head: ${{ steps.release.outputs.head }}
      base: ${{ steps.release.outputs.base }}
    steps:
      - name: Decide whether this push merged a release PR
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          publish=false
          commits=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA?per_page=100" --jq '.commits[].sha')
          for commit in $commits; do
            release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$commit/pulls?per_page=100" | jq -s \
              --arg repository "$GITHUB_REPOSITORY" --arg commit "$commit" \
              'any(.[][];
                .merged_at != null
                and .merge_commit_sha == $commit
                and .base.ref == "main"
                and .base.repo.full_name == $repository
                and .head.ref == "release/next"
                and .head.repo.full_name == $repository
              )')
            if [ "$release" = true ]; then
              publish=true
              break
            fi
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        if: steps.decide.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        if: steps.decide.outputs.publish == 'true'
      - name: Validate the release on main
        if: steps.decide.outputs.publish == 'true'
        id: release
        run: node --conditions=source script/release/preparePublish.ts
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_BASE_REF: ${{ github.event.before }}
      - name: Build packages
        if: steps.decide.outputs.publish == 'true'
        run: pnpm build
      - name: Check packed consumers and bins
        if: steps.decide.outputs.publish == 'true'
        run: pnpm test:package

  publish:
    needs: verify-packages
    if: needs.verify-packages.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.verify-packages.outputs.head }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
          node-version-file: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile=false

      - name: Validate collected release notes
        run: pnpm changelog:check
        env:
          CHANGELOG_BASE_REF: ${{ needs.verify-packages.outputs.base }}
      - name: Build packages
        run: pnpm build

      - name: Publish new package versions
        env:
          CHANGELOG_BASE_REF: ${{ needs.verify-packages.outputs.base }}
        run: node --conditions=source script/release/publishPackages.ts

      - name: Write GitHub release notes
        env:
          RELEASE_HEAD_SHA: ${{ needs.verify-packages.outputs.head }}
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_BASE_REF: ${{ needs.verify-packages.outputs.base }}
        run: node --conditions=source script/release/publishNotes.ts
