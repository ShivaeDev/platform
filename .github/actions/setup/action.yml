name: Set up workspace
description: Install the pinned Node.js and pnpm versions with the shared pnpm store cache.
inputs:
  consumer-cache:
    description: Restore the complete consumer store warmed on main.
    default: 'false'
outputs:
  store-path:
    description: pnpm's content-addressed store directory.
    value: ${{ steps.store.outputs.path }}
  consumer-cache-key:
    description: Fresh cache key for saving the complete consumer store on main.
    value: ${{ steps.consumer-cache.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 26.10.0
        package-manager-cache: false
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      with:
        cache: ${{ inputs.consumer-cache != 'true' }}
        cache_dependency_path: pnpm-lock.yaml
    - id: store
      shell: bash
      run: |
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "architecture=$(node -p 'process.arch')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: consumer-cache
      if: inputs.consumer-cache == 'true'
      with:
        path: ${{ steps.store.outputs.path }}
        key: consumer-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/*/package.json', 'script/package-check/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          consumer-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'packages/*/package.json', 'script/package-check/**') }}-
          consumer-store-v1-${{ runner.os }}-${{ runner.arch }}-
          pnpm-cache-${{ runner.os }}-${{ steps.store.outputs.architecture }}-${{ hashFiles('pnpm-lock.yaml') }}
    - shell: bash
      run: pnpm install --frozen-lockfile
