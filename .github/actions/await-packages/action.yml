name: Await package archives
description: Wait for this workflow attempt's package producer while setup runs concurrently.
inputs:
  token:
    description: GitHub token with actions read permission.
    required: true
runs:
  using: composite
  steps:
    - name: Await this attempt's package artifact
      id: wait
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ARTIFACT_NAME: packages-${{ github.sha }}-${{ github.run_attempt }}
        ARTIFACT_PREFIX: packages-${{ github.sha }}-
      run: |
        deadline=$((SECONDS + 180))
        while (( SECONDS < deadline )); do
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" \
            --jq '.artifacts[] | select(.expired == false) | .id')
          if [[ -n "$artifact_id" ]]; then
            echo "Package artifact $artifact_id is ready"
            echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          producer=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "build") | "\(.status):\(.conclusion // "")"')
          if [[ "$producer" == completed:* && "$producer" != completed:success ]]; then
            echo "::error::Package producer finished with $producer"
            exit 1
          fi
          if [[ -z "$producer" && "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then
            previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '.artifacts | map(select(.expired == false and (.name | startswith(env.ARTIFACT_PREFIX))) | select((.name | ltrimstr(env.ARTIFACT_PREFIX) | tonumber) < (env.GITHUB_RUN_ATTEMPT | tonumber))) | sort_by(.created_at) | last | .name // empty')
            if [[ -n "$previous" ]]; then
              echo "Reusing $previous because this retry does not rerun the producer"
              echo "name=$previous" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          sleep 2
        done
        echo "::error::Package artifact was not published within 180 seconds"
        exit 1
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: ${{ steps.wait.outputs.name }}
        path: .ci/packages
