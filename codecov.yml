codecov:
  require_ci_to_pass: false
  notify:
    manual_trigger: true
    wait_for_ci: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
        only_pulls: true

comment:
  layout: "header, diff, flags, components, files, reach, footer"
  behavior: default
  require_changes: false
  require_bundle_changes: false
  hide_project_coverage: false
  hide_comment_details: false
  show_carryforward_flags: true

bundle_analysis:
  status: informational

test_analytics:
  flake_detection: true

github_checks:
  annotations: true

component_management:
  individual_components:
    - component_id: effect-changes
      name: "@shivaedev/effect-changes"
      paths:
        - "packages/effect-changes/src/**"
