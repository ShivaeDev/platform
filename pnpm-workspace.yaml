packages:
  - packages/*
  - examples/*

nodeOptions: --conditions=source

# Applications depend on @shivaedev/platform alone; hoisting links the pieces it brings so they resolve by their own names.
publicHoistPattern: ["@shivaedev/*"]

# Libraries test through test-story, which depends on test-sql, so test packages form development-only cycles. Builds resolve workspace sources through the source condition, so their order inside a cycle does not matter.
ignoreWorkspaceCycles: true

overrides:
  # Recharts pins an unattested reselect release; use its attested compatible successor.
  "recharts>reselect": "catalog:"
  # `@effect/platform-node` asks for `^` its shared layer; keep that layer on
  # the catalog version so the Effect packages share one release.
  "@effect/platform-node-shared": "catalog:"

catalog:
  shadcn: 4.22.1
  "cn": 0.5.0
  "@base-ui/react": 1.9.0
  "@fontsource-variable/geist": 5.3.0
  "@fontsource-variable/geist-mono": 5.3.0
  "tw-animate-css": 1.4.0
  cmdk: 1.1.1
  "recharts": 3.10.1
  "@tanstack/react-table": 9.3.1
  reselect: 5.3.0
  railway: 3.16.0
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.45
  "@vitejs/plugin-react": 6.1.2
  vite: 8.3.4
  tailwindcss: 4.3.3
  class-variance-authority: 0.7.1
  lucide-react: 1.61.0
  "@biomejs/biome": 2.6.2
  "@effect/vitest": 4.0.5
  "@effect/atom-react": 4.0.5
  "@effect/platform-node": 4.0.5
  "@effect/platform-node-shared": 4.0.5
  "@effect/sql-sqlite-node": 4.0.5
  "@effect/sql-pg": 4.0.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react: 19.3.1
  react-dom: 19.3.1
  react-markdown: 10.1.0
  remark-gfm: 4.0.1
  remark-directive: 4.0.0
  mdast-util-directive: 3.1.1
  remark-parse: 11.0.0
  rehype-raw: 7.0.0
  unist-util-visit: 5.1.0
  unified: 11.0.5
  happy-dom: 21.0.4
  dom-accessibility-api: 0.7.1
  mermaid: 12.2.0
  knip: 6.42.1
  ignore: 7.0.13
  sort-package-json: 4.1.0
  "@types/hast": 3.0.5
  "@types/mdast": 4.0.4
  "@types/node": 24.19.2
  "@types/pg": 8.20.0
  "@typescript/native": npm:typescript@7.0.2
  effect: 4.0.5
  esbuild: 0.28.2
  better-auth: 1.7.12
  pg: 8.23.0
  pg-boss: 12.38.0
  satteri: 0.10.5
  shiki: 4.5.0
  typescript: 7.0.2
  yaml: 2.9.1
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5

catalogs:
  compiler-api:
    typescript: npm:@typescript/typescript6@6.0.2

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Framework releases must be usable together as soon as they publish.
  - "@shivaedev/*"
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
# Re-verifying every lockfile entry costs pnpm about 1 GB more memory, which
# pushes Renovate's lockfile updates past the 3 GB of the Mend-hosted runner.
# Newly resolved versions are still verified; CI and publish re-verify every
# entry with `--trust-lockfile=false`.
trustLockfile: true
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  msgpackr-extract: false
