packages:
  - packages/*

overrides:
  # `@prisma-next/cli-telemetry` asks for `^1.2.3`; 1.2.4 and 1.2.5 dropped the
  # provenance attestation earlier versions carried, which `trustPolicy:
  # no-downgrade` rejects. Drop the pin once an attested release lands.
  "@vercel/detect-agent": 1.2.3
  # `@effect/platform-node` asks for `^` its own prerelease of the shared layer;
  # keep it on the catalog Effect version instead of a newer prerelease.
  "@effect/platform-node-shared": 4.0.0-rc.112

catalog:
  "@biomejs/biome": 2.5.1
  "@effect/vitest": 4.0.0-rc.112
  "@effect/atom-react": 4.0.0-rc.112
  "@effect/platform-node": 4.0.0-rc.112
  "@effect/sql-sqlite-node": 4.0.0-rc.112
  "@effect/sql-pg": 4.0.0-rc.112
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  react: 19.2.8
  react-dom: 19.2.8
  happy-dom: 20.11.2
  ignore: 7.0.6
  dependency-cruiser: 18.1.1
  "@prisma-next/adapter-postgres": 0.15.0
  "@prisma-next/adapter-sqlite": 0.15.0
  "@prisma-next/cli": 0.15.0
  "@prisma-next/contract": 0.15.0
  "@prisma-next/postgres": 0.15.0
  "@prisma-next/sql-contract": 0.15.0
  "@prisma-next/sql-orm-client": 0.15.0
  "@prisma-next/sql-relational-core": 0.15.0
  "@prisma-next/sql-runtime": 0.15.0
  "@prisma-next/sqlite": 0.15.0
  "@prisma-next/target-postgres": 0.15.0
  "@prisma-next/target-sqlite": 0.15.0
  "@types/node": 24.10.1
  "@types/pg": 8.20.0
  "@trpc/client": 11.18.0
  "@trpc/server": 11.18.0
  superjson: 2.2.6
  "@typescript/native": npm:typescript@7.0.2
  effect: 4.0.0-rc.112
  better-auth: 1.6.25
  pg-boss: 12.23.1
  typescript: npm:@typescript/typescript6@6.0.2
  vitest: 4.1.9

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  msgpackr-extract: false
