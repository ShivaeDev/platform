packages:
  - packages/*
  - examples/*

overrides:
  # Recharts pins an unattested reselect release; use its attested compatible successor.
  "recharts>reselect": "catalog:"
  # `@prisma-next/cli-telemetry` asks for `^1.2.3`. Vercel publishes 1.2.4 and
  # later from a private repository, where npm cannot attest provenance, so
  # `trustPolicy: no-downgrade` rejects them. Keep 1.2.3 while Prisma Next
  # depends on it.
  "@vercel/detect-agent": "catalog:"
  # `@effect/platform-node` asks for `^` its shared layer; keep that layer on
  # the catalog version so the Effect packages share one release.
  "@effect/platform-node-shared": "catalog:"

