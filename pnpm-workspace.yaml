packages:
  - packages/*
  - examples/*

nodeOptions: --conditions=@shivaedev/source

# Applications depend on @shivaedev/platform alone; hoisting links the pieces it brings so they resolve by their own names.
publicHoistPattern: [ "@shivaedev/*" ]

# Libraries test through test-story, which depends on test-sql, so test packages form development-only cycles. Builds resolve workspace sources through the source condition, so their order inside a cycle does not matter.
ignoreWorkspaceCycles: true

overrides:
  # `@effect/platform-node` asks for `^` its shared layer; keep that layer on
  # the catalog version so the Effect packages share one release.
  "@effect/platform-node-shared": "catalog:"

catalog:
  "@mdn/browser-compat-data": 8.1.7
  browserslist: 4.29.5
  "@anthropic-ai/claude-agent-sdk": 0.3.316
  "@earendil-works/pi-coding-agent": 1.4.0
  "@modelcontextprotocol/sdk": 1.32.2
  "@zip.js/zip.js": 2.24.0
  resend: 6.37.0
  playwright: 1.64.1
  "cn": 0.5.1
  "@base-ui/react": 1.9.0
  "@tanstack/react-table": 9.3.1
  railway: 3.16.0
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.170.46
  "@vitejs/plugin-react": 6.1.2
  vite: 8.3.5
  tailwindcss: 4.3.3
  class-variance-authority: 0.7.1
  lucide-react: 1.65.0
  "@biomejs/biome": 2.6.4
  "@effect/vitest": 4.1.1
  "@effect/atom-react": 4.1.1
  "@effect/platform-node": 4.1.1
  "@effect/platform-node-shared": 4.1.1
  "@effect/sql-sqlite-node": 4.1.1
  "@effect/sql-pg": 4.1.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react: 19.3.1
  react-dom: 19.3.1
  happy-dom: 21.0.4
  dom-accessibility-api: 0.7.1
  knip: 6.44.0
  ignore: 7.0.14
  sort-package-json: 4.1.0
  "@types/node": 24.19.2
  "@typescript/native": npm:typescript@7.0.2
  effect: 4.1.1
  esbuild: 0.28.2
  "@better-auth/oauth-provider": 1.7.14
  better-auth: 1.7.14
  pg-boss: 12.38.0
  typescript: 7.0.2
  yaml: 2.9.1
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5

catalogs:
  claude-code:
    "@modelcontextprotocol/sdk": 1.32.2
  compiler-api:
    typescript: npm:@typescript/typescript6@6.0.2

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Framework releases must be usable together as soon as they publish.
  - "@shivaedev/*"
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
# Re-verifying every lockfile entry costs pnpm about 1 GB more memory, which
# pushes Renovate's lockfile updates past the 3 GB of the Mend-hosted runner.
# Newly resolved versions are still verified; CI and publish re-verify every
# entry with `--trust-lockfile=false`.
trustLockfile: true
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  "@google/genai": false
  protobufjs: false
  esbuild: true
  msgpackr-extract: false
patchedDependencies:
  happy-dom@21.0.4: patches/happy-dom@21.0.4.patch
