packages:
  - packages/*

overrides:
  # `@prisma-next/cli-telemetry` asks for `^1.2.3`; 1.2.4 and 1.2.5 dropped the
  # provenance attestation earlier versions carried, which `trustPolicy:
  # no-downgrade` rejects. Drop the pin once an attested release lands.
  "@vercel/detect-agent": 1.2.3

catalog:
  "@biomejs/biome": 2.5.1
  "@effect/vitest": 4.0.0-rc.108
  "@prisma-next/adapter-postgres": 0.15.0
  "@prisma-next/adapter-sqlite": 0.15.0
  "@prisma-next/cli": 0.15.0
  "@prisma-next/contract": 0.15.0
  "@prisma-next/postgres": 0.15.0
  "@prisma-next/sql-contract": 0.15.0
  "@prisma-next/sql-orm-client": 0.15.0
  "@prisma-next/sql-relational-core": 0.15.0
  "@prisma-next/sql-runtime": 0.15.0
  "@prisma-next/sqlite": 0.15.0
  "@prisma-next/target-postgres": 0.15.0
  "@prisma-next/target-sqlite": 0.15.0
  "@types/node": 24.10.1
  "@types/pg": 8.20.0
  "@trpc/server": 11.18.0
  "@typescript/native": npm:typescript@7.0.2
  effect: 4.0.0-rc.108
  better-auth: 1.6.25
  pg-boss: 12.23.1
  typescript: npm:@typescript/typescript6@6.0.2
  vitest: 4.1.9

minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # The Effect v4 pre-release line ships faster than the seven-day quarantine, so
  # tracking it always means accepting a release inside the window. These entries
  # are pinned to the exact versions reviewed here, which keeps the quarantine in
  # force for every other package and for the next Effect bump. Drop them once
  # 4.0 is stable and the catalog stops moving inside the window.
  - effect@4.0.0-rc.108
  - "@effect/vitest@4.0.0-rc.108"
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  msgpackr-extract: false
