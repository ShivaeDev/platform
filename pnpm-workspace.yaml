minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Framework releases must be usable together as soon as they publish.
  - "@shivaedev/*"
  # Effect 4.0.4 fixes pooled PostgreSQL connections released with a listener
  # or statement still open, and the migration from 4.0.0-rc.112 adopts it
  # directly. Remove these once 4.0.4 is seven days old on 2026-10-20.
  - effect@4.0.4
  - "@effect/atom-react@4.0.4"
  - "@effect/platform-node@4.0.4"
  - "@effect/platform-node-shared@4.0.4"
  - "@effect/sql-pg@4.0.4"
  - "@effect/sql-sqlite-node@4.0.4"
  - "@effect/vitest@4.0.4"
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# `prisma@7.10.0` was published without the provenance attestation earlier
# releases carry. Remove this once an attested Prisma release ships.
trustPolicyExclude:
  - prisma@7.10.0
# Re-verifying every lockfile entry costs pnpm about 1 GB more memory, which
# pushes Renovate's lockfile updates past the 3 GB of the Mend-hosted runner.
# Newly resolved versions are still verified; CI and publish re-verify every
# entry with `--trust-lockfile=false`.
trustLockfile: true
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  "@prisma/engines": false
  prisma: false
