name: Sync shared skills

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: sync-skills-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync-skills:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the shared skills
        id: check
        continue-on-error: true
        run: pnpm exec shivaedev-skills check

      - name: Sync, commit and push the shared skills
        if: steps.check.outcome == 'failure'
        run: |
          pnpm exec shivaedev-skills sync
          git add --all .agents/skills .claude/skills
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --message "Sync shared skills with @shivaedev/skills"
          git push
